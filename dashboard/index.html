<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestrator</title>
<!-- Served from public/, so it is a real file the browser can cache rather than
     a data: URI re-parsed on every load. Safari still wants a mask-icon for
     pinned tabs; the theme-color tints the tab strip on mobile Chrome. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="mask-icon" href="/favicon.svg" color="#1c2116">
<meta name="theme-color" content="#1c2116">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
